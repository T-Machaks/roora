services:
  app:
    build: .
    image: roora:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL/UPLOAD_DIR are set to in .env —
      # both must live under the mounted volume so they survive
      # container recreation, not inside the ephemeral container
      # filesystem.
      DATABASE_URL: "file:/app/data/dev.db"
      UPLOAD_DIR: "/app/data/uploads"
      NODE_ENV: "production"
    volumes:
      - roora_data:/app/data

volumes:
  roora_data:
