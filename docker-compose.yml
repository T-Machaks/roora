services:
  app:
    build: .
    image: roora:latest
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL/UPLOAD_DIR are set to in .env —
      # both must live under the mounted volume so they survive
      # container recreation, not inside the ephemeral container
      # filesystem.
      DATABASE_URL: "file:/app/data/dev.db"
      UPLOAD_DIR: "/app/data/uploads"
      NODE_ENV: "production"
    volumes:
      - roora_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  roora_data:
  caddy_data:
  caddy_config:
