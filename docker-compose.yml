services:
  app:
    build: .
    image: roora:latest
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is set to in .env — it must live
      # under the mounted volume so it survives container recreation, not
      # inside the ephemeral container filesystem. Uploaded media goes to
      # S3 (S3_BUCKET/AWS_REGION from .env), not this volume, and picks up
      # credentials from the host's EC2 instance role automatically.
      DATABASE_URL: "file:/app/data/dev.db"
      NODE_ENV: "production"
    volumes:
      - roora_data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  roora_data:
  caddy_data:
  caddy_config:
